# nginx config for the compose stack — daily dev surface.
#
# Three server blocks:
#   - default_server: sinkhole for any unrecognised Host. In production
#     dnsmasq routes everything to the box, so this catches youtube.com,
#     tiktok.com, etc. with the friendly fallback page.
#   - home.kids / hello.kids: static placeholder.
#   - wikipedia.kids: reverse proxy to the kiwix container.
#
# The VM uses ansible/roles/proxy/templates/nginx.conf.j2 with
# slightly different upstream targets (127.0.0.1:8080 for kiwix on
# the host).

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" host=$host';
    access_log /var/log/nginx/access.log main;

    # Default server — anything not matching a named server_name lands here.
    server {
        listen 80 default_server;
        server_name _;
        root /srv/launcher;

        # Sinkhole every path to the friendly "not at home" page.
        location / {
            try_files /sinkhole.html =404;
        }
    }

    # home.kids — placeholder landing page.
    # The .example.com aliases mirror /treehouse.yml's hostnames: table
    # so the same vhost answers to both internal and public names.
    server {
        listen 80;
        server_name home.kids hello.kids
                    home-kids.example.com hello-kids.example.com;
        root /srv/launcher;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # wikipedia.kids — reverse proxy to kiwix container.
    server {
        listen 80;
        server_name wikipedia.kids wiki-kids.example.com;

        location / {
            proxy_pass http://kiwix:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Kiwix can be slow on first ZIM read; tolerate it.
            proxy_read_timeout 60s;
        }
    }
}
