# Test variant of compose.yml. Brings up the kiwix container alone on
# a non-default port so tests don't collide with anything the user has
# running. Used by tests/conftest.py.
#
# No proxy here — production lost the compose-side proxy; tests now
# hit kiwix directly. Host-routing tests live in test_live.py against
# the deployed VM (see docs/commands.md).

services:
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.7.0
    container_name: treehouse-test-kiwix
    restart: "no"
    ports:
      - "127.0.0.1:18180:8080"
    volumes:
      - ./tests/fixtures/zims:/data:ro
    command: ["--library", "/data/library.xml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
