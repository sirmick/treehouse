# Test variant of compose.yml. Mirrors the production stack (nginx +
# kiwix) but on different ports (18180/18181 vs 18080) and a different
# project name (treehouse-test) so a tester running tests doesn't
# collide with their own `make dev-up` stack.
#
# Used by tests/conftest.py.

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: treehouse-test-proxy
    restart: "no"
    ports:
      - "127.0.0.1:18181:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/srv/launcher:ro
    depends_on:
      kiwix:
        condition: service_healthy

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.7.0
    container_name: treehouse-test-kiwix
    restart: "no"
    ports:
      - "127.0.0.1:18180:8080"
    volumes:
      - ./tests/fixtures/zims:/data:ro
    command: ["--library", "/data/library.xml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
