---
# Network --------------------------------------------------------------------
# The structured `network:` and `hostnames:` config lives in /treehouse.yml
# at the repo root, loaded by site.yml via vars_files. The flat names
# below are kept as aliases so the existing roles (which read
# `kids_subnet`, `kids_host_ip`, etc. directly) keep working until they
# migrate to the structured paths.
# kids_host_ip flips by mode — host nginx + adjacent services bind to it.
kids_host_ip: >-
  {{ network.lan.ip.split('/')[0]
     if network.mode == 'lan'
     else network.isolated.host_ip }}

# These stay derived from the isolated config since they have no analog
# in lan mode (the LAN's own resolver/DHCP take over).
kids_subnet:     "{{ network.isolated.subnet }}"
kids_dhcp_start: "{{ network.isolated.dhcp_start }}"
kids_dhcp_end:   "{{ network.isolated.dhcp_end }}"
kids_domain:     "{{ network.isolated.domain }}"
kids_bridge:     "{{ network.isolated.bridge }}"
# kids_iface and mgmt_iface are detected dynamically by the network role
# (set_fact). Don't pin them here — names depend on kernel naming policy.

kids_vhosts:        "{{ hostnames.values() | map(attribute='internal') | list + ['admin.kids'] }}"

# Storage --------------------------------------------------------------------
treehouse_root:     "/srv/treehouse"
treehouse_user:     "treehouse"
treehouse_group:    "treehouse"

treehouse_paths:
  - "{{ treehouse_root }}/config"
  - "{{ treehouse_root }}/state"
  - "{{ treehouse_root }}/content"
  - "{{ treehouse_root }}/content/zims"
  # launcher/ is created + owned by the proxy role as www-data, since
  # nginx serves it. Keep it out of base/ to avoid an ownership tug-of-war.
  - "{{ treehouse_root }}/logs"

# Backup ---------------------------------------------------------------------
# For milestone 1, restic targets a host-mounted dir. External drive is a
# Phase 9 (Pi migration) concern.
# Inside state/ so the repo lives on the persistent disk (survives
# `make down`). Off-box restic target — NAS/laptop on lan mode, USB
# on isolated mode — is a future per-deployment override in
# treehouse.yml; not built yet.
restic_repo:        "{{ treehouse_root }}/state/restic-repo"
restic_password:    "milestone1-placeholder-rotate-me"
restic_keep_daily:  7
restic_keep_weekly: 4
restic_keep_monthly: 12

# Container images (pinned per deployment.md convention) --------------------
kiwix_image:        "ghcr.io/kiwix/kiwix-serve:3.7.0"

# ZIM seed/ingest list ------------------------------------------------------
# Drives both ansible/seed.yml (download into kiwix's library) and
# ansible/ingest.yml (chunk into MeiliSearch). The (dir, catalog, version)
# tuple is what Phase-3's updater would resolve from the OPDS catalog;
# until then we pin by hand. Bump versions when new builds land at
# <https://download.kiwix.org/zim/>.
zims:
  - dir: wikipedia
    catalog: wikipedia_en_simple_all_maxi
    version: "2026-02"
    source: wikipedia
    kind: article
  - dir: wiktionary
    catalog: wiktionary_en_simple_all_nopic
    version: "2026-04"
    source: wiktionary
    kind: definition
  - dir: vikidia
    catalog: vikidia_en_all_maxi
    version: "2026-03"
    source: vikidia
    kind: article
