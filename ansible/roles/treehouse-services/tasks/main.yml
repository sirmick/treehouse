---
# Render compose.yml, bring up the content containers (kiwix,
# meilisearch). Host nginx talks to those containers directly via the
# loopback ports they publish — no compose-side proxy in between.

# compose.yml uses RELATIVE volume paths (./content/zims, ./state/meili).
# Compose resolves those relative to the compose file's own location,
# so the file plus its sibling trees (content/, state/) must all live
# at /srv/treehouse/ — mirroring the repo layout.
- name: compose.yml at /srv/treehouse
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../compose.yml"
    dest: "{{ treehouse_root }}/compose.yml"
    owner: "{{ treehouse_user }}"
    group: "{{ treehouse_group }}"
    mode: "0644"
  notify: docker compose up

- name: Library.xml stub if missing (so kiwix-serve starts even with no ZIMs)
  ansible.builtin.copy:
    dest: "{{ treehouse_root }}/content/zims/library.xml"
    owner: "{{ treehouse_user }}"
    group: "{{ treehouse_group }}"
    mode: "0644"
    force: false
    content: |
      <?xml version="1.0" encoding="UTF-8" ?>
      <library version="20110515">
      </library>

- name: Bring up the stack now (idempotent)
  ansible.builtin.command:
    cmd: docker compose -f {{ treehouse_root }}/compose.yml up -d
  register: compose_up
  changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout"
