---
# nginx on the host. Bound to the kids interface only.

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Disable distro default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

# Copy the SvelteKit static build (launcher/build/) onto the box.
# Run `make launcher-build` on the laptop before `make provision`; the
# task fails loudly if the dir doesn't exist rather than serving stale
# content silently.
- name: Confirm launcher build artifacts exist
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../launcher/build/index.html"
  register: launcher_build
  delegate_to: localhost
  become: false

- name: Fail if launcher hasn't been built
  ansible.builtin.fail:
    msg: |
      launcher/build/index.html is missing. Run `make launcher-build`
      on the laptop before `make provision`.
  when: not launcher_build.stat.exists

- name: Sync launcher build to {{ treehouse_root }}/launcher
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../launcher/build/"
    dest: "{{ treehouse_root }}/launcher/"
    owner: www-data
    group: www-data
    mode: "0644"
    directory_mode: "0755"

- name: nginx site config
  ansible.builtin.template:
    src: treehouse.conf.j2
    dest: /etc/nginx/sites-available/treehouse.conf
    owner: root
    group: root
    mode: "0644"
  # Skip ansible's `validate:` here — it requires `%s` for the temp path,
  # but a sites-available snippet can't be validated standalone (nginx -t
  # needs the full config tree). The `reload nginx` handler runs `nginx -t`
  # implicitly and will surface syntax errors there.
  notify: reload nginx

- name: Enable treehouse site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/treehouse.conf
    dest: /etc/nginx/sites-enabled/treehouse.conf
    state: link
  notify: reload nginx

- name: Enable + start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
