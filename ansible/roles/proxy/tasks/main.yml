---
# nginx on the host. Bound to the kids interface only.

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Disable distro default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: nginx data dir for static sites
  ansible.builtin.file:
    path: "{{ treehouse_root }}/launcher"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Static placeholder home page
  ansible.builtin.copy:
    dest: "{{ treehouse_root }}/launcher/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
    content: |
      <!doctype html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>Treehouse</title>
        <style>
          body { font-family: system-ui, sans-serif; max-width: 40em;
                 margin: 4em auto; padding: 0 1em; line-height: 1.5; }
          a { font-size: 1.5em; padding: 0.5em 1em; display: inline-block;
              background: #f0f4f8; border-radius: 0.5em; text-decoration: none;
              color: #2c3e50; }
          a:hover { background: #d6e1ec; }
        </style>
      </head>
      <body>
        <h1>Treehouse</h1>
        <p>This is a friendly little corner of the internet.</p>
        <p><a href="http://wikipedia.kids/">Wikipedia for Schools</a></p>
      </body>
      </html>

- name: Sinkhole landing page
  ansible.builtin.copy:
    dest: "{{ treehouse_root }}/launcher/sinkhole.html"
    owner: www-data
    group: www-data
    mode: "0644"
    content: |
      <!doctype html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>Not at home</title>
        <style>
          body { font-family: system-ui, sans-serif; max-width: 30em;
                 margin: 6em auto; padding: 0 1em; text-align: center;
                 line-height: 1.5; }
          a { color: #2c3e50; }
        </style>
      </head>
      <body>
        <h1>That's not something we have at home.</h1>
        <p>Try <a href="http://home.kids/">home.kids</a>.</p>
      </body>
      </html>

- name: nginx site config
  ansible.builtin.template:
    src: treehouse.conf.j2
    dest: /etc/nginx/sites-available/treehouse.conf
    owner: root
    group: root
    mode: "0644"
    validate: "nginx -t -c /etc/nginx/nginx.conf"
  notify: reload nginx

- name: Enable treehouse site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/treehouse.conf
    dest: /etc/nginx/sites-enabled/treehouse.conf
    state: link
  notify: reload nginx

- name: Enable + start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
