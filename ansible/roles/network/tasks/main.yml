---
# Brings up the kids' segment: static IP on br-kids interface,
# dnsmasq as DHCP+DNS authority, nftables as the drop-all-forward
# defense layer. See docs/network.md.

# ----- Detect interfaces ---------------------------------------------------
# Don't assume eth0/eth1. With Debian's default predictable naming the
# interfaces are enpXsY; with `net.ifnames=0` they're ethN. We bind to
# whatever the kernel actually has so the playbook works either way.
#
# IMPORTANT: filter to physical-NIC name patterns (en*, eth*). A naive
# "first non-default interface" picks docker's br-XXXXXXXXXX once the
# treehouse-services role has run, and 10.10.10.1 ends up on the docker
# bridge instead of the kids NIC — silently, since `curl 10.10.10.1`
# from inside the VM still works (the docker bridge IS reachable from
# the host netns). The tablet-VM verify-isolation probe catches it.
- name: Detect mgmt + kids interfaces
  ansible.builtin.set_fact:
    # Single-NIC VMs (the post-mgmt-NIC-removal default — see bin/up.sh
    # comment on why the dual-NIC pattern was dev-only): the kids NIC
    # IS the default route's interface. mgmt_iface is set to the same
    # value purely so the nftables rules that reference it (SSH carve-out)
    # don't blow up with `undefined`. There's no separate mgmt path.
    kids_iface: "{{ (ansible_facts.interfaces | select('match', '^(en|eth)') | sort) | first }}"
    mgmt_iface: "{{ (ansible_facts.interfaces | select('match', '^(en|eth)') | sort) | first }}"

- name: Show detected interfaces
  ansible.builtin.debug:
    msg: "mgmt={{ mgmt_iface }}  kids={{ kids_iface }}"

- name: Required packages
  ansible.builtin.apt:
    name: "{{ ['nftables'] + (['dnsmasq'] if network.mode == 'isolated' else []) }}"
    state: present

# ----- Static IP on the kids interface --------------------------------------
# Two flavours: isolated mode is /24 with no gateway/DNS (the VM IS the
# DHCP/DNS authority); lan mode takes the configured static IP, gateway,
# and DNS servers from treehouse.yml.
- name: Persist kids interface config (systemd-networkd)
  ansible.builtin.copy:
    dest: /etc/systemd/network/10-kids.network
    owner: root
    group: root
    mode: "0644"
    content: |
      [Match]
      Name={{ kids_iface }}

      [Network]
      {% if network.mode == 'isolated' %}
      Address={{ network.isolated.host_ip }}/24
      ConfigureWithoutCarrier=true
      {% else %}
      Address={{ network.lan.ip }}
      Gateway={{ network.lan.gateway }}
      {% for dns in network.lan.dns %}
      DNS={{ dns }}
      {% endfor %}
      {% endif %}
      LinkLocalAddressing=no
      IPv6AcceptRA=no
  notify: reload networkd

# Flush now so the kids interface gets its IP before dnsmasq tries to
# bind to listen-address below (isolated mode), or before nftables
# rules reference it.
- name: Apply network changes immediately
  ansible.builtin.meta: flush_handlers

# ----- dnsmasq (isolated mode only) ----------------------------------------
# In lan mode the LAN's existing resolver handles DNS and the LAN's
# DHCP server hands out leases. We don't run dnsmasq.
- name: Disable dnsmasq listening on the default resolver port for systemd-resolved hosts
  ansible.builtin.lineinfile:
    path: /etc/default/dnsmasq
    regexp: '^DNSMASQ_OPTS='
    line: 'DNSMASQ_OPTS="--conf-dir=/etc/dnsmasq.d,*.conf"'
    create: true
    mode: "0644"
  when: network.mode == 'isolated'

- name: dnsmasq kids segment config
  ansible.builtin.copy:
    dest: /etc/dnsmasq.d/kids.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Treehouse kids segment — dnsmasq config.
      # Authoritative DHCP + DNS for {{ network.isolated.subnet }}. No upstream resolver.

      interface={{ kids_iface }}
      bind-interfaces
      except-interface=lo
      listen-address={{ network.isolated.host_ip }}

      # DHCP scope. NO gateway. NO upstream DNS.
      dhcp-range={{ network.isolated.dhcp_start }},{{ network.isolated.dhcp_end }},12h
      # Send option 3 (router) empty — kids segment is isolated, no gateway.
      # `option:router,` (named) requires a value; raw `3` allows empty.
      dhcp-option=3
      dhcp-option=option:dns-server,{{ network.isolated.host_ip }}
      dhcp-option=option:domain-name,{{ network.isolated.domain }}
      dhcp-option=option:ntp-server,{{ network.isolated.host_ip }}

      # DNS — every .{{ network.isolated.domain }} name → host. nginx distinguishes by Host header.
      domain={{ network.isolated.domain }}
      local=/{{ network.isolated.domain }}/
      expand-hosts
      address=/.{{ network.isolated.domain }}/{{ network.isolated.host_ip }}

      # Sinkhole — every other DNS query → host. No upstream.
      address=/#/{{ network.isolated.host_ip }}

      no-resolv
      no-poll
      no-hosts
  notify: restart dnsmasq
  when: network.mode == 'isolated'

# ----- nftables -------------------------------------------------------------
- name: nftables kids ruleset
  ansible.builtin.copy:
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      #!/usr/sbin/nft -f
      # Scope our reset to our own table — `flush ruleset` would wipe
      # docker's NAT chains too, breaking any container with a
      # `ports:` mapping until docker is restarted. `add table` is
      # idempotent (no-op if it exists); `flush table` then clears
      # any prior contents before we redefine it.
      add table inet kids
      flush table inet kids

      table inet kids {
          chain forward {
              type filter hook forward priority 0; policy drop;

              # Allow kids segment to talk to itself (host services bound
              # to the kids interface).
              iifname "{{ kids_iface }}" oifname "{{ kids_iface }}" accept

              # Belt: drop kids → anywhere else explicitly.
              iifname "{{ kids_iface }}" drop
          }

          chain input {
              type filter hook input priority 0; policy drop;

              ct state established,related accept
              iifname "lo" accept

              # Kids segment may reach host services on these ports.
              iifname "{{ kids_iface }}" tcp dport { 53, 80, 443 } accept
              iifname "{{ kids_iface }}" udp dport { 53, 67, 68, 123 } accept
              # ICMP for ping diagnostics.
              iifname "{{ kids_iface }}" ip protocol icmp accept

              # Management interface ({{ mgmt_iface }}): SSH only.
              iifname "{{ mgmt_iface }}" tcp dport 22 accept
              iifname "{{ mgmt_iface }}" ct state new tcp dport 22 accept
          }

          chain output {
              type filter hook output priority 0; policy accept;
          }
      }
  notify: reload nftables

- name: Enable nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Enable + start dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    enabled: true
    state: started
  when: network.mode == 'isolated'

# In lan mode dnsmasq might still be installed from a previous isolated
# run; make sure it's stopped + disabled so it can't bind.
- name: Stop + disable dnsmasq when not in isolated mode
  ansible.builtin.systemd:
    name: dnsmasq
    enabled: false
    state: stopped
  when: network.mode != 'isolated'
  failed_when: false
