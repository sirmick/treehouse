---
- name: reload networkd
  # `systemctl restart systemd-networkd` doesn't always re-evaluate
  # /etc/systemd/network/*.network against existing links — observed on
  # Debian 12 cloud, the new file gets ignored until `networkctl reload`.
  ansible.builtin.command: networkctl reload
  changed_when: true

- name: restart dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    state: restarted
    enabled: true

- name: reload nftables
  ansible.builtin.systemd:
    name: nftables
    state: reloaded
