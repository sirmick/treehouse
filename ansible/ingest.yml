---
# Run the ingestor against each ZIM in group_vars `zims`. Indexes
# documents into MeiliSearch on the VM. Both content (ZIMs) and
# state (MeiliSearch index) live on the persistent disk, so this
# runs entirely VM-side — no SSH-forward from the laptop, no
# laptop-side ZIM cache.
#
# First run installs python3-venv + libzim + meilisearch into a
# venv at /srv/treehouse/state/searchd-venv, copies the ingestor
# script onto the VM, then loops over zims invoking it. Subsequent
# runs reuse the venv.
#
# Run via `make ingest`, which uses the qemu-guest-agent inventory.

- name: Ingest ZIMs into MeiliSearch
  hosts: treehouse
  become: true
  gather_facts: false

  vars_files:
    - ../treehouse.yml

  vars:
    venv_dir: "{{ treehouse_root }}/state/searchd-venv"
    searchd_dir: "{{ treehouse_root }}/state/searchd"

  tasks:
    - name: Required apt packages
      ansible.builtin.apt:
        name:
          - python3-venv
          - python3-pip
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Searchd dir on persistent state
      ansible.builtin.file:
        path: "{{ searchd_dir }}"
        state: directory
        owner: "{{ treehouse_user }}"
        group: "{{ treehouse_group }}"
        mode: "0755"

    - name: Copy ingestor scripts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../treehouse/searchd/{{ item }}"
        dest: "{{ searchd_dir }}/{{ item }}"
        owner: "{{ treehouse_user }}"
        group: "{{ treehouse_group }}"
        mode: "0644"
      loop:
        - ingest_kiwix.py
        - ingest_books.py

    - name: Create venv (idempotent)
      ansible.builtin.command:
        cmd: "python3 -m venv {{ venv_dir }}"
        creates: "{{ venv_dir }}/bin/python"

    - name: Install Python deps
      ansible.builtin.pip:
        virtualenv: "{{ venv_dir }}"
        name:
          - "libzim>=3"
          - "meilisearch>=0.31"

    - name: Run ingestor per ZIM (this is the slow part — minutes per ZIM)
      ansible.builtin.command:
        cmd: >-
          {{ venv_dir }}/bin/python {{ searchd_dir }}/ingest_kiwix.py
          --zim {{ treehouse_root }}/content/zims/{{ item.catalog }}_{{ item.version }}.zim
          --source {{ item.source }}
          --kind {{ item.kind }}
          --meili-url http://127.0.0.1:7700
          --index treehouse
      loop: "{{ zims }}"
      changed_when: true

    # Books are ingested from the manifest that seed-books.yml writes.
    # No-op if seed-books hasn't run yet (manifest missing → ingestor
    # exits with rc 1; we tolerate that so a books-less deployment
    # doesn't break `make ingest`).
    - name: Check whether the books manifest exists
      ansible.builtin.stat:
        path: "{{ treehouse_root }}/state/books-manifest.jsonl"
      register: books_manifest

    - name: Index books into MeiliSearch
      when: books_manifest.stat.exists
      ansible.builtin.command:
        cmd: >-
          {{ venv_dir }}/bin/python {{ searchd_dir }}/ingest_books.py
          --manifest {{ treehouse_root }}/state/books-manifest.jsonl
          --meili-url http://127.0.0.1:7700
          --index treehouse
      changed_when: true
