<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0ea5e9" />
		<title>Not at home</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				background: #f0f9ff;
				color: #1e293b;
				font-family:
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
			}
			main {
				min-height: 100%;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				padding: 2rem;
				text-align: center;
			}
			.emoji {
				font-size: 6rem;
				margin-bottom: 1rem;
			}
			h1 {
				font-size: 2.25rem;
				font-weight: 600;
				letter-spacing: -0.02em;
				margin: 0 0 0.5rem;
				max-width: 30ch;
			}
			p {
				font-size: 1.15rem;
				color: #64748b;
				margin: 0 0 2.25rem;
			}
			a {
				display: inline-block;
				padding: 1rem 2rem;
				border-radius: 1rem;
				background: #fff;
				color: #0c4a6e;
				font-size: 1.15rem;
				font-weight: 500;
				text-decoration: none;
				box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
				border: 1px solid #e2e8f0;
				transition: background 150ms;
			}
			a:hover,
			a:focus {
				background: #e0f2fe;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="emoji" aria-hidden="true">🌱</div>
			<h1>That's not something we have at home.</h1>
			<p>Try one of the things on the home page.</p>
			<a href="http://home.kids/">Go home</a>
		</main>
	</body>
</html>
