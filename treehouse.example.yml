---
# Treehouse deployment settings — single source of truth for the per-host
# config that varies between deployments (laptop dev VM vs Pi vs another
# laptop). Read by:
#
#   - bin/up.sh                       — picks libvirt args from `network:`
#   - ansible (vars_files in site.yml) — group_vars/all.yml derives
#                                        legacy flat names from this
#   - launcher build                  — tile hrefs from `hostnames:`
#
# This file (treehouse.example.yml) is the committed template with safe
# placeholder values. On a fresh clone:
#
#   cp treehouse.example.yml treehouse.yml
#   $EDITOR treehouse.yml             # set the lan IP, public domain, etc.
#
# treehouse.yml itself is gitignored, so personal-deployment values
# (LAN IPs, public domain) stay out of the committed history.

network:
  # mode = isolated: VM NIC on libvirt's br-kids (no DHCP from LAN,
  #                  dnsmasq inside the VM serves DHCP+DNS for the kids
  #                  segment on `isolated.subnet`). `make verify-isolation`
  #                  is meaningful in this mode.
  # mode = lan:      VM NIC on libvirt's `lan` network, which bridge-forwards
  #                  onto a host-managed Linux bridge (br-lan) spanning the
  #                  host's physical NICs. The VM gets a static IP on the
  #                  LAN; LAN devices (e.g. an upstream reverse proxy) can
  #                  reach it, and host↔VM connectivity works. dnsmasq is
  #                  disabled — the LAN's existing resolver is used. Trade:
  #                  no structural isolation, so `verify-isolation` is
  #                  gated off in this mode. One-time host setup
  #                  (br-lan + libvirt `lan` net) is in docs/network.md.
  mode: isolated

  isolated:
    subnet:     10.10.10.0/24
    host_ip:    10.10.10.1
    dhcp_start: 10.10.10.50
    dhcp_end:   10.10.10.250
    domain:     kids
    bridge:     br-kids        # libvirt network name

  lan:
    libvirt_net: lan            # libvirt network (bridge-mode onto host br-lan)
    # Placeholder values — TEST-NET-1 (RFC 5737, safe for examples).
    # Set these to your LAN's actual subnet before flipping mode to
    # `lan`.
    ip:         192.0.2.50/24
    gateway:    192.0.2.1
    dns:        [192.0.2.1]

# Public-name aliases for the kids vhosts. nginx adds the public name
# alongside the internal Host header (so `Host: home.kids` and
# `Host: home-kids.example.com` both hit the same vhost). The launcher
# build uses the public name for tile hrefs when running in
# `network.mode == lan`.
#
# Every top-level app on the box gets an entry here. One entry → one
# nginx server block (auto-generated from this table) → one place
# tile generators can look it up.
#
# Schema per entry:
#   internal: <name>.kids                     # stable internal name
#   public:   <name>-kids.<your-domain>       # public alias
#   serves:   launcher | kiwix                # which backend
#   landing:  /search | /maps  (optional)     # serves:launcher only —
#                                             #   redirect / here
#   book:     wikipedia | wiktionary | vikidia (optional)
#                                             # serves:kiwix only —
#                                             #   redirect / to that
#                                             #   ZIM. Looked up in
#                                             #   group_vars `zims` by
#                                             #   the `source` field.
#
# Replace example.com with your own public domain. The internal `.kids`
# names are stable and don't need to change.
hostnames:
  home:
    internal: home.kids
    public:   home-kids.example.com
    serves:   launcher
  hello:
    internal: hello.kids
    public:   hello-kids.example.com
    serves:   launcher
  search:
    internal: search.kids
    public:   search-kids.example.com
    serves:   launcher
    landing:  /search
  maps:
    internal: maps.kids
    public:   map-kids.example.com
    serves:   launcher
    landing:  /maps
  wikipedia:
    internal: wikipedia.kids
    public:   wiki-kids.example.com
    serves:   kiwix
    book:     wikipedia
  dictionary:
    internal: dictionary.kids
    public:   dictionary-kids.example.com
    serves:   kiwix
    book:     wiktionary
  vikidia:
    internal: vikidia.kids
    public:   vikidia-kids.example.com
    serves:   kiwix
    book:     vikidia
