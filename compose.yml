# Treehouse stack — content services, run on the box (VM today, Pi
# tomorrow). The host nginx (provisioned by ansible/roles/proxy) is
# the only external entry point; backends here publish on the VM's
# loopback and host nginx forwards by Host header.
#
# The compose stack is a deployment unit on the box; there's no
# laptop-dev `docker compose up -d` workflow anymore (use vite for
# launcher iteration via `make launcher-dev`, run full-stack tests
# through the VM via the public path).
#
# Future milestones add kolibri, sugarizer, peertube, synapse,
# calibre-web, tileserver, ollama, launcher (broker), searchd,
# aigateway. Each is a separate service block on the same private
# network.

services:
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.7.0
    container_name: treehouse-kiwix
    restart: unless-stopped
    ports:
      # Loopback only — host nginx forwards wikipedia.kids here.
      - "127.0.0.1:8080:8080"
    volumes:
      # rw because `kiwix-manage add` writes /data/library.xml at seed time.
      - ./content/zims:/data
    # Wrap kiwix-serve so an empty library.xml (no ZIMs seeded yet)
    # doesn't restart-loop the container. kiwix-tools 3.7.0 treats an
    # empty library as a load failure and exits — we'd rather idle and
    # let `make seed` populate the library, then restart us.
    entrypoint: ["sh", "-c"]
    command:
      - |
        if /usr/local/bin/kiwix-serve --port=8080 --library /data/library.xml; then
          :
        else
          echo "kiwix-serve exited (empty library?) — idling. Run make seed, then docker restart treehouse-kiwix." >&2
          exec sleep infinity
        fi
    networks: [treehouse-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: treehouse-meili
    restart: unless-stopped
    ports:
      # Loopback only — host nginx forwards /api/search here. The
      # ingestor (ansible/ingest.yml) talks to it via this same port
      # since both run inside the VM.
      - "127.0.0.1:7700:7700"
    volumes:
      # State (indexes, snapshots, dumps). Lives on the bind-mounted
      # state subdir of the persistent content disk — survives a
      # `make down`/`make up` cycle.
      - ./state/meili:/meili_data
    environment:
      # Dev-mode: no master key required, public search endpoint.
      # Production-mode (with a generated key) is a future slice;
      # nothing exposes the index outside the VM today.
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    networks: [treehouse-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  treehouse-net:
    driver: bridge
