# Treehouse stack — runs on the box (VM today, Pi tomorrow) AND on the
# developer's laptop for daily iteration.
#
# Daily-dev path (laptop): `docker compose up -d`. Hits nginx at
# 127.0.0.1:18080 with explicit Host: headers. No dnsmasq needed.
#
# Production path (VM): the Ansible treehouse-services role drops this
# file at /srv/treehouse/compose.yml (plus the sibling nginx/ + content/
# trees) so the relative volume paths resolve the same way as on the
# laptop.
#
# Future milestones add kolibri, sugarizer, peertube, synapse,
# calibre-web, tileserver, ollama, launcher, searchd, aigateway. Each
# is a separate service block on the same private network.

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: treehouse-proxy
    restart: unless-stopped
    ports:
      # Compose-host port. VM publishes 80 on the kids-segment IP via
      # the Ansible proxy role; on the laptop we use 18080 to avoid
      # needing root.
      - "127.0.0.1:18080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/srv/launcher:ro
    networks: [treehouse-net]
    # service_started, not service_healthy: the launcher (home.kids,
    # sinkhole) must come up even before any ZIM has been seeded. With
    # service_healthy, an empty library would block all routes including
    # the home page.
    depends_on:
      kiwix:
        condition: service_started

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.7.0
    container_name: treehouse-kiwix
    restart: unless-stopped
    volumes:
      # rw because `kiwix-manage add` writes /data/library.xml at seed time.
      - ./content/zims:/data
    # Wrap kiwix-serve so an empty library.xml (no ZIMs seeded yet)
    # doesn't restart-loop the container. kiwix-tools 3.7.0 treats an
    # empty library as a load failure and exits — we'd rather idle and
    # let `make seed-wikipedia` populate the library, then restart us.
    entrypoint: ["sh", "-c"]
    command:
      - |
        if /usr/local/bin/kiwix-serve --port=8080 --library /data/library.xml; then
          :
        else
          echo "kiwix-serve exited (empty library?) — idling. Run make seed-wikipedia, then docker restart treehouse-kiwix." >&2
          exec sleep infinity
        fi
    networks: [treehouse-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  treehouse-net:
    driver: bridge
